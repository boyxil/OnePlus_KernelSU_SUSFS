name: Build mt6895-only (RMX3561-compatible)

# Builds kernels ONLY for MediaTek mt6895 / dimensity8000 devices
# (OP-ACE-RACE, OP-ACE, OP10r and their 5.10.x variants).
# All of these share the wild/mt6895 kernel source and therefore boot on
# the Realme RMX3561 (RED8BEL1) as well.
#
# Includes a `enable_ds` switch:
#   false (default) -> kernel built WITHOUT CONFIG_SYSVIPC -> VINTF passes
#                      -> no "internal problem with your device" dialog
#   true            -> kernel built WITH Droidspaces (CONFIG_SYSVIPC=y)
#                      -> VINTF fails -> dialog appears (needs ro.treble.enabled=false workaround)

permissions:
  contents: write
  actions: write

on:
  workflow_dispatch:
    inputs:
      model:
        description: 'Device model (all share mt6895 kernel source, all boot on RMX3561)'
        required: true
        type: choice
        options:
          - All mt6895
          - OP-ACE-RACE
          - OP-ACE-RACE-5.10.209
          - OP-ACE-RACE-5.10.226
          - OP-ACE
          - OP-ACE-5.10.209
          - OP-ACE-5.10.226
          - OP10r
        default: All mt6895
      ksu_type:
        description: 'KernelSU variant'
        required: true
        type: choice
        options:
          - KSUN (KernelSU-Next)
          - KSU (original)
        default: KSUN (KernelSU-Next)
      ksu_branch:
        description: 'KSU branch or commit hash (empty = auto: KSUN boyxil fixed SHA, KSU main)'
        type: string
        default: ''
      susfs_branch:
        description: 'SUSFS branch or commit hash (empty = auto-detect)'
        type: string
        default: ''
      enable_ds:
        description: 'Enable Droidspaces (CONFIG_SYSVIPC=y)? OFF = no VINTF dialog (recommended for stock-like boots)'
        required: true
        type: boolean
        default: false
      make_release:
        description: 'Create a release?'
        required: true
        type: boolean
        default: false

jobs:
  set-op-model:
    runs-on: ubuntu-latest
    outputs:
      matrix: ${{ steps.set-matrix.outputs.matrix }}
      device_count: ${{ steps.set-matrix.outputs.count }}
      susfs_hash_android12_5_10: ${{ steps.set-matrix.outputs.susfs_hash_android12_5_10 }}
      ksu_resolved_hash: ${{ steps.set-matrix.outputs.ksu_resolved_hash }}
      ksu_options_normalized: ${{ steps.set-matrix.outputs.ksu_options_normalized }}
      susfs_base_version: ${{ steps.set-matrix.outputs.susfs_base_version }}
    env:
      GH_TOKEN: ${{ github.token }}
      GH_HTTP_TIMEOUT: 600
    steps:
      - name: 📥 Checkout Code (to access configs/)
        uses: actions/checkout@v6
        with:
          sparse-checkout: |
            configs/
          sparse-checkout-cone-mode: false

      - name: 🔍 Generate build matrix (mt6895 / dimensity8000 only)
        id: set-matrix
        shell: bash
        run: |
          set -euo pipefail
          echo "::group::Matrix generation (mt6895 only)"

          # Resolve KSU type and branch from inputs
          ksu_type_input="${{ github.event.inputs.ksu_type }}"
          if [[ "$ksu_type_input" == KSUN* ]]; then
            ksu_type="KSUN"
          else
            ksu_type="KSU"
          fi

          ksu_branch_input="${{ github.event.inputs.ksu_branch }}"
          if [ -z "$ksu_branch_input" ]; then
            if [ "$ksu_type" = "KSUN" ]; then
              # boyxil fork fixed branch (SELinux fix)
              ksu_ref="7400d69d41b5ecb2570cc41104b60db310bd42ff"
            else
              ksu_ref="main"
            fi
          else
            ksu_ref="$ksu_branch_input"
          fi

          ksu_options_normalized="[{\"type\":\"$ksu_type\",\"hash\":\"$ksu_ref\"}]"
          echo "ksu_options_normalized=$ksu_options_normalized" >> $GITHUB_OUTPUT
          echo "ℹ️  KSU: $ksu_type ($ksu_ref)"

          # Robustly assemble all config JSONs into a single array via jq slurp.
          # (The hand-rolled echo/loop assembly is fragile on the runner.)
          jq -s '.' $(find configs/ -name "*.json" -print0 | xargs -0) > matrix.json
          echo "Loaded $(jq 'length' matrix.json) total configs"

          # Filter: ONLY mt6895 / dimensity8000, branch wild/mt6895, android12-5.10, A15/A16 (+ legacy OOS)
          jq_filter='map(select(.os_version == "A15" or .os_version == "A16" or .os_version == "OOS15" or .os_version == "OOS16")) | map(select(.android_version == "android12" and .kernel_version == "5.10")) | map(select(.soc == "dimensity8000")) | map(select(.branch == "wild/mt6895"))'

          selected_model="${{ github.event.inputs.model }}"
          if [ "$selected_model" != "All mt6895" ]; then
            jq_filter="$jq_filter | map(select(.model == \"$selected_model\"))"
            echo "ℹ️  Model: $selected_model"
          else
            echo "ℹ️  Building ALL mt6895 / dimensity8000 devices (android12-5.10)"
          fi

          echo "ℹ️  Filter: mt6895 only (dimensity8000 + wild/mt6895 + android12-5.10)"

          filtered=$(jq -c "$jq_filter" matrix.json)
          count=$(jq 'length' <<<"$filtered")

          filtered=$(echo "$filtered" | jq '
            sort_by(
              (.os_version | gsub("OOS"; "") | gsub("A"; "") | tonumber) * -1,
              .model
            )
          ')

          if [ "$count" -eq 0 ]; then
            echo "::error::No mt6895 / dimensity8000 android12-5.10 configs found!"
            echo ""
            echo "Available mt6895 configurations:"
            jq -r '.[] | select(.soc == "dimensity8000" and .branch == "wild/mt6895") | "  - \(.model) (\(.os_version), \(.soc))"' matrix.json
            exit 1
          fi

          echo "$filtered" | jq '.' > matrix.json

          merged_matrix=$(jq -n --argjson devices "$filtered" --argjson ksu_list "$ksu_options_normalized" '[ $devices[] as $dev | $ksu_list[] as $ksu | ($dev + {ksu_type: $ksu.type, ksu_hash: $ksu.hash}) ]')

          final_count=$(echo "$merged_matrix" | jq 'length')
          echo "✅ Found $final_count mt6895 device(s) to build"
          echo ""
          echo "Selected devices:"
          jq -r '.[] | "  - \(.model) (\(.os_version), \(.soc), \(.android_version)-\(.kernel_version), \(.ksu_type) - \(.ksu_hash))"' <<<"$merged_matrix"

          echo "count=$count" >> "$GITHUB_OUTPUT"

          if [ "$ksu_type" == "KSUN" ]; then
            KSU_REPO_OWNER="boyxil"
            KSU_REPO_NAME="KernelSU-Next"
          else
            KSU_REPO_OWNER="tiann"
            KSU_REPO_NAME="KernelSU"
          fi

          HEAD_REF="refs/heads/${ksu_ref}"
          TAG_REF="refs/tags/${ksu_ref}"

          QUERY='query($owner: String!, $name: String!, $headRef: String!, $tagRef: String!, $objRef: String!) {
            repository(owner: $owner, name: $name) {
              hb: ref(qualifiedName: $headRef) { t: target { ... on Commit { o: oid } } }
              ht: ref(qualifiedName: $tagRef) { t: target { ... on Commit { o: oid } } }
              ho: object(expression: $objRef) { ... on Commit { o: oid } }
            }
          }'

          MAX_RETRIES=3
          RETRY_COUNT=0
          RETRY_DELAY=5

          echo "Resolving $ksu_type hash ($ksu_ref)..."

          until [ $RETRY_COUNT -ge $MAX_RETRIES ]; do
            RESULT=$(gh api graphql -f query="$QUERY" -f owner="$KSU_REPO_OWNER" -f name="$KSU_REPO_NAME" -f headRef="$HEAD_REF" -f tagRef="$TAG_REF" -f objRef="$ksu_ref" 2>/dev/null)
            EXIT_CODE=$?

            if [ $EXIT_CODE -eq 0 ] && [ ! -z "$RESULT" ]; then
              echo "  ✅ API Success"
              break
            fi

            RETRY_COUNT=$((RETRY_COUNT + 1))
            echo "::warning::API failed (Attempt $RETRY_COUNT/$MAX_RETRIES). Retrying in ${RETRY_DELAY}s..."
            sleep $RETRY_DELAY
          done

          if [ $RETRY_COUNT -ge $MAX_RETRIES ]; then
            # Fall back: assume the hash is already a SHA
            resolved_sha="$ksu_ref"
            echo "::warning::GitHub API unreachable. Assuming '$ksu_ref' is a valid SHA."
          else
            resolved_sha=$(echo "$RESULT" | jq -r '.data.repository | (.hb.t.o // .ht.t.o // .ho.o // "unknown")')
            if [ "$resolved_sha" == "unknown" ]; then
              echo "::error::Ref/Hash '$ksu_ref' does not exist in $KSU_REPO_OWNER/$KSU_REPO_NAME"
              exit 1
            fi
          fi

          echo "  ✅ Resolved: $ksu_type/$ksu_ref → $resolved_sha"
          echo "ksu_resolved_hash=$resolved_sha" >> "$GITHUB_OUTPUT"

          merged_matrix=$(echo "$merged_matrix" | jq --arg resolved_sha "$resolved_sha" 'map(.ksu_resolved_hash = $resolved_sha)')

          # SUSFS hash fetch
          SUSFS_REPO="https://gitlab.com/simonpunk/susfs4ksu.git"
          GITLAB_PROJECT_PATH="simonpunk/susfs4ksu"

          SUSFS_INPUT="${{ github.event.inputs.susfs_branch }}"
          if [ -n "$SUSFS_INPUT" ]; then
            SUSFS_BRANCH="$SUSFS_INPUT"
            echo "🔧 Using user-specified SUSFS: $SUSFS_BRANCH"
          else
            SUSFS_BRANCH="main"
            echo "🔧 Using default SUSFS branch: main"
          fi

          GITLAB_GQL_URL="https://gitlab.com/api/graphql"
          GITLAB_QUERY='query($projectPath: ID!, $ref: String!) {
            project(fullPath: $projectPath) {
              repository {
                blobs(ref: $ref, paths: ["susfs.h"]) {
                  nodes { rawBlob }
                }
                tree(ref: $ref) {
                  lastCommit { sha }
                }
              }
            }
          }'

          MAX_RETRIES=3
          RETRY_COUNT=0
          RETRY_DELAY=5

          echo "Resolving SUSFS hash ($SUSFS_BRANCH)..."

          until [ $RETRY_COUNT -ge $MAX_RETRIES ]; do
            RESPONSE=$(curl -s --max-time 30 -H "Content-Type: application/json" \
              -X POST "$GITLAB_GQL_URL" \
              -d "{\"query\": \"$GITLAB_QUERY\", \"variables\": {\"projectPath\": \"$GITLAB_PROJECT_PATH\", \"ref\": \"$SUSFS_BRANCH\"}}" 2>/dev/null)
            EXIT_CODE=$?

            resolved=$(echo "$RESPONSE" | jq -r '.data.project.repository.tree.lastCommit.sha // empty' 2>/dev/null)

            if [ $EXIT_CODE -eq 0 ] && [ -n "$resolved" ] && [ "$resolved" != "null" ]; then
              echo "  ✅ GitLab API Success"
              break
            fi

            RETRY_COUNT=$((RETRY_COUNT + 1))
            echo "::warning::GitLab API failed (Attempt $RETRY_COUNT/$MAX_RETRIES). Retrying in ${RETRY_DELAY}s..."
            sleep $RETRY_DELAY
          done

          if [ -z "$resolved" ] || [ "$resolved" = "null" ]; then
            echo "::error::Could not resolve SUSFS ref '$SUSFS_BRANCH' on GitLab."
            exit 1
          fi

          susfs_base_version="unknown"
          if [ "${{ inputs.make_release }}" = "true" ]; then
            extracted=$(echo "$RESPONSE" | jq -r '.data.project.repository.blobs.nodes[0].rawBlob // empty' | grep '#define SUSFS_VERSION' | awk -F'"' '{print $2}')
            susfs_base_version="${extracted:-unknown}"
            echo "  ✅ SUSFS_VERSION = $susfs_base_version"
          fi

          echo "  ✅ Resolved: SUSFS → $resolved"
          echo "susfs_hash_android12_5_10=$resolved" >> "$GITHUB_OUTPUT"
          echo "susfs_base_version=$susfs_base_version" >> "$GITHUB_OUTPUT"

          susfs_hashes_json=$(jq -n --arg a12 "$resolved" '{ "android12-5.10": $a12 }')

          merged_matrix=$(echo "$merged_matrix" | jq \
            --argjson hashes "$susfs_hashes_json" \
            '[.[] | . + {susfs_resolved_hash: ($hashes["\(.android_version)-\(.kernel_version)"] // "unknown")}]')

          merged_matrix=$(echo "$merged_matrix" | jq '
            sort_by(
              (.os_version | gsub("OOS"; "") | gsub("A"; "") | tonumber? // 0) * -1,
              .model
            )
          ')

          wrapped=$(jq -n --argjson items "$merged_matrix" '{ include: $items }')
          echo "matrix=$(jq -c . <<< "$wrapped")" >> "$GITHUB_OUTPUT"

          echo "::endgroup::"

      - name: Upload build matrix
        uses: actions/upload-artifact@v7
        with:
          name: build-matrix-mt6895
          path: matrix.json
          archive: false
          retention-days: 7

  build:
    name: build (${{ matrix.model }}, ${{ matrix.soc }}, ${{ matrix.android_version }}-${{ matrix.kernel_version }}, ${{ matrix.os_version }}, ${{ matrix.ksu_type }}, ds=${{ github.event.inputs.enable_ds }})
    needs: [set-op-model]
    if: |
      !cancelled() &&
      needs.set-op-model.result == 'success'
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix: ${{ fromJSON(needs.set-op-model.outputs.matrix) }}
    outputs:
      ksun_ver: ${{ steps.build.outputs.ksu_version }}
      ksu_ver: ${{ steps.build.outputs.ksu_version }}
    env:
      ENABLE_DS: ${{ github.event.inputs.enable_ds }}
    steps:
      - name: 📥 Checkout Code
        uses: actions/checkout@v6
        with:
          fetch-depth: 1

      - name: Install ccache
        run: sudo apt-get update -qq && sudo DEBIAN_FRONTEND=noninteractive apt-get install -y --no-install-recommends ccache

      - name: Configure ccache
        run: |
          CACHE_DIR="${{ github.workspace }}/.ccache"
          LDCACHE_DIR="${{ github.workspace }}/.ld_cache"
          mkdir -p "$CACHE_DIR"
          mkdir -p "$LDCACHE_DIR"
          cat >> "$GITHUB_ENV" <<EOF
          CCACHE_DIR=$CACHE_DIR
          LDCACHE_DIR=$LDCACHE_DIR
          CCACHE_MAXSIZE=4G
          CCACHE_COMPILERCHECK=content
          CCACHE_BASEDIR=${GITHUB_WORKSPACE}
          CCACHE_NOHASHDIR=true
          CCACHE_IGNOREOPTIONS=--sysroot*
          CCACHE_COMPRESSION=true
          CCACHE_COMPRESSION_LEVEL=3
          CCACHE_DIRECT=true
          CCACHE_FILE_CLONE=true
          CCACHE_INODE_CACHE=true
          CCACHE_IS_KERNEL_COMPILING=true
          CCACHE_UMASK=002
          CCACHE_SLOPPINESS=file_macro,time_macros,include_file_mtime,include_file_ctime,pch_defines,system_headers,locale
          EOF

      - name: 🧹 Prepare op_config_json (override ds by switch, strip KSU fields)
        id: prepare_config
        shell: bash
        run: |
          # Take the matrix entry, override the `ds` field per the workflow input,
          # then strip KSU-only fields before passing to build-kernel action.
          # ds=false  -> Add Droidspaces step is skipped -> no CONFIG_SYSVIPC -> VINTF passes
          # ds=true   -> Droidspaces added -> CONFIG_SYSVIPC=y -> VINTF dialog appears
          config_json=$(jq -nc --argjson m '${{ toJSON(matrix) }}' --argjson ds "${ENABLE_DS:-false}" '$m | .ds = $ds | del(.ksu_type, .ksu_hash, .ksu_resolved_hash)')
          echo "config_json=$config_json" >> "$GITHUB_OUTPUT"
          echo "Effective ds = ${ENABLE_DS:-false} (workflow override)"

      - name: 🔨 Build Kernel
        id: build
        uses: ./.github/actions/build-kernel
        with:
          op_config_json: ${{ steps.prepare_config.outputs.config_json }}
          ksu_type: ${{ matrix.ksu_type }}
          ksu_branch_or_hash: ${{ matrix.ksu_resolved_hash }}
          susfs_commit_hash_or_branch: ${{ matrix.susfs_resolved_hash }}
          optimize_level: O2
          build_timestamp: ''
          clean: true
          debug: false
          github_token: ${{ secrets.GITHUB_TOKEN }}

      - name: 📝 Job summary
        if: always()
        run: |
          cat >> $GITHUB_STEP_SUMMARY << EOF

          ### ${{ matrix.model }} (${{ matrix.soc }}) - ${{ matrix.os_version }} - ${{ job.status == 'success' && '✅ Success' || '❌ Failed' }}

          **Kernel:** ${{ matrix.android_version }}-${{ matrix.kernel_version }}
          **Droidspaces (ds):** ${{ github.event.inputs.enable_ds }} ${{ github.event.inputs.enable_ds == 'false' && '(no CONFIG_SYSVIPC → no VINTF dialog)' || '(CONFIG_SYSVIPC=y → VINTF dialog)' }}
          EOF

          if [ "${{ steps.build.outcome }}" = "success" ]; then
            cat >> $GITHUB_STEP_SUMMARY << EOF
          | Metric | Value |
          |--------|-------|
          | **Kernel** | ${{ steps.build.outputs.kernel_version }} |
          EOF
            if [ "${{ matrix.ksu_type }}" = "KSUN" ]; then
              echo "| **KSU Next** | v${{ steps.build.outputs.ksu_version }} |" >> $GITHUB_STEP_SUMMARY
            else
              echo "| **KSU** | v${{ steps.build.outputs.ksu_version }} |" >> $GITHUB_STEP_SUMMARY
            fi
            if [ "${{ matrix.susfs }}" = true ]; then
              echo "| **SUSFS** | ${{ steps.build.outputs.susfs_version }} |" >> $GITHUB_STEP_SUMMARY
            fi
            echo "| **Build Time** | ${{ steps.build.outputs.build_time }}s |" >> $GITHUB_STEP_SUMMARY
            echo "| **Image SHA256** | \`${{ steps.build.outputs.image_sha256 }}\` |" >> $GITHUB_STEP_SUMMARY
          fi

  trigger-release:
    needs: [set-op-model, build]
    runs-on: ubuntu-latest
    if: |
      !cancelled() &&
      inputs.make_release == true &&
      needs.build.result == 'success' &&
      needs.set-op-model.result == 'success'
    env:
      REPO_OWNER: ${{ github.repository_owner }}
      REPO_NAME: ${{ github.event.repository.name }}
      GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      SUSFS_BASE_VERSION: ${{ needs.set-op-model.outputs.susfs_base_version }}
      ENABLE_DS: ${{ github.event.inputs.enable_ds }}
      RELEASE_NAME: 'mt6895 (RMX3561-compatible) Kernels with KernelSU Next & SUSFS ${{ needs.set-op-model.outputs.susfs_base_version }}'
    steps:
      - name: 📥 Checkout code
        uses: actions/checkout@v6
        with:
          fetch-depth: 0

      - name: 🏷️ Generate and Create New Tag
        run: |
          DS_SUFFIX=""
          if [ "$ENABLE_DS" = "true" ]; then DS_SUFFIX="-ds"; fi
          LATEST_MATCHING_TAG=$(gh api repos/$REPO_OWNER/$REPO_NAME/tags \
            --jq "[.[] | select(.name | startswith(\"mt6895${DS_SUFFIX}-${SUSFS_BASE_VERSION}-r\"))] \
                  | sort_by(.name | split(\"-r\")[1] | tonumber) \
                  | last | .name // empty")

          if [ -z "$LATEST_MATCHING_TAG" ]; then
            NEW_TAG="mt6895${DS_SUFFIX}-${SUSFS_BASE_VERSION}-r1"
          else
            NEW_TAG=$(echo "$LATEST_MATCHING_TAG" | awk -F'-r' '{printf "%s-r%d", $1, $2+1}')
          fi

          echo "New tag: $NEW_TAG"
          echo "NEW_TAG=${NEW_TAG}" >> $GITHUB_ENV
          git tag $NEW_TAG
          git push origin $NEW_TAG

      - name: 📥 Download Artifacts
        uses: actions/download-artifact@v8
        with:
          path: ./downloaded-artifacts
          merge-multiple: true
          skip-decompress: true

      - name: 📝 Generate Release Notes
        id: generate-notes
        run: |
          rm -f ./downloaded-artifacts/ccache-binary.zip

          declare -A device_info

          for file in $(find downloaded-artifacts -maxdepth 1 -name "*.zip" -type f | sort); do
            if [ -f "$file" ]; then
              zipname=$(basename "$file" .zip)
              rest="${zipname#AK3_}"
              IFS='_' read -ra parts <<< "$rest"
              model="${parts[0]}"
              os_version="${parts[1]}"
              kernel_version="${parts[2]}"
              ksu_type="${parts[3]}"
              ksu_ver="${parts[4]}"
              if [ "${parts[5]:-}" = "SuSFS" ]; then
                susfs_ver="${parts[6]:-unknown}"
              else
                susfs_ver="none"
              fi
              full_model="${model}_${os_version}_${kernel_version}"
              device_info["$full_model"]="$model|$os_version|$kernel_version|$ksu_type|$ksu_ver|$susfs_ver|$zipname"
            fi
          done

          ksu_type="${{ fromJSON(needs.set-op-model.outputs.ksu_options_normalized)[0].type }}"

          DS_NOTE=""
          if [ "$ENABLE_DS" = "true" ]; then
            DS_NOTE="

          > ⚠️ **Droidspaces ENABLED** — these kernels have CONFIG_SYSVIPC=y and will show the \"internal problem with your device\" dialog on stock-like boots. Use the ro.treble.enabled=false workaround module to suppress it."
          else
            DS_NOTE="

          > ✅ **Droidspaces DISABLED** — no CONFIG_SYSVIPC, VINTF passes, no dialog. Safe for stock-like boots (RMX3561)."
          fi

          cat << EOF > release_notes.md
          # mt6895 (RMX3561-compatible) Kernels with KernelSU Next & SUSFS $SUSFS_BASE_VERSION

          > **Build Date:** $(date -u '+%Y-%m-%d %H:%M:%S UTC')
          ${DS_NOTE}
          ---

          ## 📱 Built Devices (${#device_info[@]} total)

          | Model | OS | Kernel | Features |
          |-------|-----|--------|----------|
          EOF

          while IFS= read -r full_key; do
            [ -z "$full_key" ] && continue
            IFS='|' read -r model os_ver kernel_ver _ _ _ zipfile <<< "${device_info["$full_key"]}"
            download_url="https://github.com/${REPO_OWNER}/${REPO_NAME}/releases/download/${NEW_TAG}/${zipfile}.zip"
            model_link="[$model]($download_url)"
            printf "| %s | %s | %s | KSU+SUSFS |\n" "$model_link" "$os_ver" "$kernel_ver" >> release_notes.md
          done < <(printf '%s\n' "${!device_info[@]}" | sort)

          cat << EOF >> release_notes.md

          ---

          **Manager:** [KernelSU Next Manager](https://github.com/KernelSU-Next/KernelSU-Next/releases)
          **SUSFS Module:** [ksu_module_susfs](https://github.com/sidex15/ksu_module_susfs/releases)
          **Flasher:** [Kernel Flasher](https://github.com/fatalcoder524/KernelFlasher/releases)

          ### ℹ️ About this build
          All kernels here share the `wild/mt6895` (dimensity8000) source and boot on the
          Realme RMX3561 (RED8BEL1) as well as the OnePlus Ace Race / Ace / 10r.
          EOF

      - name: 📤 Upload Release Assets
        run: |
          cd downloaded-artifacts
          for file in *.zip; do
            [ -f "$file" ] && gh release upload "$NEW_TAG" "$file" --clobber
          done

      - name: 📝 Update Release Notes
        run: |
          gh release edit "$NEW_TAG" \
            --notes-file release_notes.md \
            --title "$RELEASE_NAME"
